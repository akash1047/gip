name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: gip-linux-amd64
          - goos: darwin
            goarch: amd64
            name: gip-darwin-amd64
          - goos: windows
            goarch: amd64
            name: gip-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go build -o ${{ matrix.name }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
